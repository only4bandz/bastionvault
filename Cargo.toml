[workspace]
resolver = "2"
members = [
    "crates/crypto-core",
    "crates/crypto-wasm",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.91"
repository = "https://github.com/only4bandz/bastionvault"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
