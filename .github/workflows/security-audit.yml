# Supply-chain security gate: known-vulnerability scans for every dependency
# tree in the repo, on each push/PR touching a manifest and on a weekly
# schedule (advisories are published continuously — a green merge can go
# red without any commit).
name: security-audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-audit:
    name: RustSec advisories (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing after checkout needs git credentials. The default
          # writes GITHUB_TOKEN into .git/config, where build scripts,
          # proc macros, npm lifecycle scripts and PR-authored guard
          # scripts running later in the same job can read it.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # 1.91.0
        with:
          toolchain: 1.91.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}
      - name: Install cargo-audit 0.22.2
        run: |
          if ! cargo-audit --version 2>/dev/null | grep -Fxq 'cargo-audit 0.22.2'; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi
      - name: Audit Cargo.lock against the RustSec database
        run: cargo audit --deny warnings

  npm-audit:
    name: npm advisories (app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing after checkout needs git credentials. The default
          # writes GITHUB_TOKEN into .git/config, where build scripts,
          # proc macros, npm lifecycle scripts and PR-authored guard
          # scripts running later in the same job can read it.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
      - name: Audit app dependency tree
        working-directory: app
        run: npm audit --audit-level=high
