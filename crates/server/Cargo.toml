[package]
name = "server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Zero-knowledge sync server: stores opaque encrypted blobs, never plaintext."

[lints]
workspace = true

[dependencies]
crypto-core = { path = "../crypto-core" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Hash lent du secret d'authentification côté serveur (obligation ZK).
argon2 = "0.5"
# Encodage hex des jetons de session.
data-encoding = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
