[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Zero-knowledge sync server: stores opaque encrypted blobs, never plaintext."
default-run = "server"

[lints]
workspace = true

[dependencies]
crypto-core = { path = "../crypto-core" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Slow hash of the authentication secret on the server side (ZK requirement).
argon2 = "0.5"
# Hex encoding of session tokens.
data-encoding = "2"
# Durable storage of opaque encrypted blobs (bundled = no system SQLite needed).
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
# Structured, level-filtered logs. Deliberately used ONLY for non-secret
# operational data (method, status, terse error) — never emails/tokens/blobs.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Transactional mail leaves SQLite through authenticated STARTTLS SMTP only.
lettre = { version = "0.11.22", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
