[package]
name = "server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Zero-knowledge sync server: stores opaque encrypted blobs, never plaintext."

[lints]
workspace = true

[dependencies]
crypto-core = { path = "../crypto-core" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Slow hash of the authentication secret on the server side (ZK requirement).
argon2 = "0.5"
# Hex encoding of session tokens.
data-encoding = "2"
# Durable storage of opaque encrypted blobs (bundled = no system SQLite needed).
rusqlite = { version = "0.32", features = ["bundled"] }
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
