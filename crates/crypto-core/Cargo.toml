[package]
name = "crypto-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Zero-knowledge cryptographic core for the password manager (native + WASM)."

[lints]
workspace = true

[dependencies]
# KDF: slow, memory-hard derivation of the master password.
argon2 = "0.5"
# AEAD: authenticated encryption, 192-bit nonce (random-safe).
chacha20poly1305 = "0.10"
# Sub-key derivation.
hkdf = "0.12"
sha2 = "0.10"
# Cryptographic randomness (OS CSPRNG; "js" feature added on the WASM side).
rand_core = { version = "0.6", features = ["getrandom"] }
# Wipes secrets from memory on drop.
zeroize = { version = "1", features = ["derive"] }
# Constant-time comparisons.
subtle = "2"
# Serialization of the encrypted envelopes + the manifest.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Human-readable base32 encoding of the Secret Key (Emergency Kit).
data-encoding = "2"
thiserror = "2"
# Bastion Send: X25519 sealed box (recipient encryption) + Ed25519 signatures.
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
