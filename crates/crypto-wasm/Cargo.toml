[package]
name = "crypto-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "WebAssembly bindings around crypto-core for the web app and Chrome extension."

# NB: no `[lints] workspace = true` here — the workspace forbids `unsafe`,
# yet wasm-bindgen generates unsafe code. The core (crypto-core), for its part,
# stays under `forbid(unsafe)`.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crypto-core = { path = "../crypto-core" }
wasm-bindgen = "0.2"
serde_json = "1"
base64 = "0.22"
zeroize = "1"

# Browser entropy for getrandom — ONLY on the wasm32 target.
# On the host (native tests/builds), getrandom uses the usual OS backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
serde_json = "1"
